<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My college id card </title>
</head>
<body>
    <container>
        <div class="card-container">
            <div class="id-card">
                <header class="card-header">
                    <img src="">
                    <p>pragnya degree college</p>
                </header>
            </div>
        </div>
    </container>
    <container>
        <div class="photo-wrap">
            <img src="clgphoto.jpg">
            <main class="card-body">
                <div class="name-section">
                    <h2 class="student-name">Bhargavi</h2>
                    <p>pragnya degree college</p>
                </div>
                <hr>
                <div class="details">
                    <p><strong>course:</strong>BCA</p>
                    <p><strong>Graduction Year:</strong>2024-2027</p>
                </div>
            </main>
        </div>
        <div class="id-line">
            <span class="id-label">ID-NO</span>
            <span class="id-value">ID-VALUE</span>
            </div>
            <div class="barcode"></div>
            <footer class="card-footer"></footer>
    </container>    
</body>
</html>
